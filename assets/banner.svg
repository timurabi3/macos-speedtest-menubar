<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="SpeedBar — live network speed in the macOS menu bar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a08"/>
      <stop offset="0.5" stop-color="#0a1512"/>
      <stop offset="1" stop-color="#0a1410"/>
    </linearGradient>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="ul" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#f87171"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title{font:800 70px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#ecfdf5}
      .tag{font:500 24px 'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif;fill:#a7f3d0}
      .mono{font:700 34px 'SFMono-Regular',Consolas,monospace}
      .lbl{font:600 15px 'Segoe UI',sans-serif;fill:#94a3b8}
      .rise{opacity:0;transform:translateY(12px);animation:rise .7s ease-out forwards}
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}
      @keyframes rise{to{opacity:1;transform:translateY(0)}}
      .dash{stroke-dasharray:6 10;animation:march 1s linear infinite}
      @keyframes march{to{stroke-dashoffset:-32}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="300" cy="120" r="300" fill="url(#glow)">
    <animate attributeName="cx" values="300;900;300" dur="14s" repeatCount="indefinite"/>
  </circle>
  <rect x="0" y="0" width="1200" height="5" fill="url(#dl)"/>

  <g class="rise d1"><text x="72" y="120" class="title">SpeedBar</text></g>
  <g class="rise d2"><text x="76" y="160" class="tag">Live download &amp; upload in your macOS menu bar — updated 5&#215;/sec.</text></g>

  <!-- live readout -->
  <g transform="translate(76,210)" class="rise d2">
    <text class="mono" fill="#4ade80">▼ 942</text>
    <text x="140" y="0" class="lbl" fill="#4ade80">Mbps</text>
    <text x="240" y="0" class="mono" fill="#f87171">▲ 318</text>
    <text x="392" y="0" class="lbl" fill="#f87171">Mbps</text>
  </g>

  <!-- animated sparklines -->
  <g transform="translate(720,70)">
    <rect x="0" y="0" width="410" height="180" rx="14" fill="#08110d" stroke="#153024" stroke-width="2"/>
    <text x="20" y="34" class="lbl" fill="#4ade80">download</text>
    <text x="20" y="150" class="lbl" fill="#f87171">upload</text>

    <!-- download sparkline -->
    <polyline fill="none" stroke="url(#dl)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      points="20,80 60,60 100,72 140,44 180,66 220,40 260,58 300,36 340,64 390,50">
      <animate attributeName="points" dur="3s" repeatCount="indefinite"
        values="20,80 60,60 100,72 140,44 180,66 220,40 260,58 300,36 340,64 390,50;
                20,66 60,44 100,58 140,70 180,40 220,62 260,38 300,60 340,42 390,58;
                20,80 60,60 100,72 140,44 180,66 220,40 260,58 300,36 340,64 390,50"/>
    </polyline>

    <!-- upload sparkline -->
    <polyline fill="none" stroke="url(#ul)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      points="20,120 60,132 100,118 140,138 180,124 220,140 260,122 300,136 340,120 390,130">
      <animate attributeName="points" dur="3.4s" repeatCount="indefinite"
        values="20,120 60,132 100,118 140,138 180,124 220,140 260,122 300,136 340,120 390,130;
                20,134 60,120 100,138 140,122 180,140 220,124 260,138 300,120 340,136 390,122;
                20,120 60,132 100,118 140,138 180,124 220,140 260,122 300,136 340,120 390,130"/>
    </polyline>
  </g>
</svg>
